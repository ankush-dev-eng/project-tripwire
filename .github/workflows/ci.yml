name: TRIPWIRE CI

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Test Suite with Coverage
        run: |
          pytest tests/ --cov=backend --cov=lab --cov-report=xml --cov-report=term-missing

      - name: Verify Safety & Honesty Invariants
        run: |
          pytest tests/safety/test_egress_isolation.py

