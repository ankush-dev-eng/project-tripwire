name: TRIPWIRE CI

on:
  push:
    branches:
      - main
      - 'phase/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint with Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run Test Suite with Coverage
        run: |
          python -m pytest tests/ --cov=backend --cov=lab --cov-report=xml --cov-report=term-missing

      - name: Verify Safety & Honesty Invariants
        run: |
          python -m pytest tests/safety/test_egress_isolation.py

