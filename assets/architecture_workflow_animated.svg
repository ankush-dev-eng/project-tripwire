<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="580">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181B" />
      <stop offset="100%" stop-color="#181E22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D2327" />
      <stop offset="100%" stop-color="#161B1E" />
    </linearGradient>
    <linearGradient id="safetyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2E25" />
      <stop offset="100%" stop-color="#121D18" />
    </linearGradient>
    <linearGradient id="beamGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6F8F7B" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#4F7A5A" stop-opacity="1" />
      <stop offset="100%" stop-color="#6F8F7B" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Blueprint Grid -->
    <pattern id="diagGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#252C31" stroke-width="0.7" />
    </pattern>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .sans { font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
      
      /* Path Flow Animations */
      @keyframes dashFlow {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      .flowing-wire {
        stroke-dasharray: 6 6;
        animation: dashFlow 2.5s linear infinite;
      }
      .flowing-wire-fast {
        stroke-dasharray: 5 5;
        animation: dashFlow 1.4s linear infinite;
      }
      
      /* Pulse Animation */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.08); }
      }
      .pulsing-node {
        transform-origin: center;
        animation: pulseGlow 2.8s ease-in-out infinite;
      }

      /* Radar Sweep Animation */
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .radar-arm {
        transform-origin: 600px 85px;
        animation: radarSweep 6s linear infinite;
      }

      /* Status Blink */
      @keyframes ledBlink {
        0%, 100% { fill: #4F7A5A; }
        50% { fill: #6F8F7B; }
      }
      .led-active { animation: ledBlink 1.8s infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="580" fill="url(#bgCanvas)" rx="10" />
  <rect width="1200" height="580" fill="url(#diagGrid)" opacity="0.45" rx="10" />

  <!-- Outer Header & Badges -->
  <g transform="translate(40, 36)">
    <circle cx="10" cy="10" r="5" class="led-active" />
    <text x="26" y="15" fill="#6F8F7B" class="mono" font-size="12" font-weight="600" letter-spacing="1.5">TRIPWIRE REAL-TIME AGENTIC DAST PIPELINE</text>
    <text x="26" y="32" fill="#D9D4C7" class="sans" font-size="14">Continuous Discovery • Dynamic Graph Reasoning • Double-Proof Verification</text>
  </g>
  <g transform="translate(970, 32)">
    <rect width="190" height="30" rx="4" fill="#14181B" stroke="#4F7A5A" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#6F8F7B" />
    <text x="28" y="20" fill="#F2EFE8" class="mono" font-size="11" font-weight="600">EGRESS ISOLATED</text>
  </g>

  <!-- Flowing Interconnection Wires -->
  <!-- Wire 1: Triggers -> Recon -->
  <path d="M 220 180 L 290 180" fill="none" stroke="#6F8F7B" stroke-width="2.2" class="flowing-wire" />
  <!-- Wire 2: Recon -> Knowledge Graph -->
  <path d="M 500 180 L 570 180" fill="none" stroke="#6F8F7B" stroke-width="2.2" class="flowing-wire" />
  <!-- Wire 3: Knowledge Graph -> Planner -->
  <path d="M 780 180 L 850 180" fill="none" stroke="#C79A3B" stroke-width="2.2" class="flowing-wire" />
  <!-- Wire 4: Planner down to Executors -->
  <path d="M 980 240 L 980 290" fill="none" stroke="#C79A3B" stroke-width="2" class="flowing-wire" />
  <!-- Wire 5: Executors left to Safety Core -->
  <path d="M 850 350 L 780 350" fill="none" stroke="#B5693E" stroke-width="2.2" class="flowing-wire-fast" />
  <!-- Wire 6: Safety Core left to Double-Proof Verifier -->
  <path d="M 460 350 L 390 350" fill="none" stroke="#4F7A5A" stroke-width="2.5" class="flowing-wire" />
  <!-- Wire 7: Verifier down to Mission Control & Retest -->
  <path d="M 240 410 L 240 450 L 500 450" fill="none" stroke="#6F8F7B" stroke-width="2" class="flowing-wire" />

  <!-- ================= STAGE 1: INGEST & CHANGE TRIGGERS ================= -->
  <g transform="translate(40, 110)">
    <rect width="180" height="140" rx="6" fill="url(#cardGrad)" stroke="#2B343B" stroke-width="1.2" />
    <rect width="180" height="26" rx="6" fill="#14181B" />
    <text x="12" y="18" fill="#6F8F7B" class="mono" font-size="10" font-weight="700">01 // INGESTION</text>
    
    <g transform="translate(14, 42)">
      <circle cx="6" cy="6" r="3" fill="#6F8F7B" />
      <text x="16" y="10" fill="#F2EFE8" class="sans" font-size="12" font-weight="600">CI/CD Deploy Hooks</text>
      <text x="16" y="24" fill="#8B979E" class="mono" font-size="10">Webhook / commit diff</text>
    </g>
    <g transform="translate(14, 76)">
      <circle cx="6" cy="6" r="3" fill="#6F8F7B" />
      <text x="16" y="10" fill="#F2EFE8" class="sans" font-size="12" font-weight="600">Gateway Traffic Logs</text>
      <text x="16" y="24" fill="#8B979E" class="mono" font-size="10">Active/zombie deltas</text>
    </g>
    <g transform="translate(14, 110)">
      <circle cx="6" cy="6" r="3" fill="#6F8F7B" />
      <text x="16" y="10" fill="#F2EFE8" class="sans" font-size="12" font-weight="600">JS Bundle Hashes</text>
      <text x="16" y="24" fill="#8B979E" class="mono" font-size="10">Frontend route drift</text>
    </g>
  </g>

  <!-- ================= STAGE 2: SPEC-FREE RECON CRAWLER ================= -->
  <g transform="translate(290, 110)">
    <rect width="210" height="140" rx="6" fill="url(#cardGrad)" stroke="#2B343B" stroke-width="1.2" />
    <rect width="210" height="26" rx="6" fill="#14181B" />
    <text x="12" y="18" fill="#6F8F7B" class="mono" font-size="10" font-weight="700">02 // SPEC-FREE RECON</text>
    
    <!-- Mini Radar Scope Icon -->
    <circle cx="184" cy="13" r="7" fill="none" stroke="#6F8F7B" stroke-width="1" />
    <line x1="184" y1="13" x2="188" y2="9" stroke="#4F7A5A" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" from="0 184 13" to="360 184 13" dur="3s" repeatCount="indefinite" />
    </line>

    <text x="16" y="52" fill="#F2EFE8" class="sans" font-size="13" font-weight="600">Autonomous Crawler</text>
    <text x="16" y="70" fill="#D9D4C7" class="sans" font-size="11">Zero spec dependency (no OpenAPI)</text>

    <rect x="16" y="86" width="178" height="42" rx="4" fill="#14181B" stroke="#252C31" />
    <text x="24" y="102" fill="#6F8F7B" class="mono" font-size="10">Regex &amp; AST JS Extract</text>
    <text x="24" y="118" fill="#8B979E" class="mono" font-size="9">Dynamic Endpoint Mapping</text>
  </g>

  <!-- ================= STAGE 3: KNOWLEDGE GRAPH & INVENTORY ================= -->
  <g transform="translate(570, 110)">
    <rect width="210" height="140" rx="6" fill="url(#cardGrad)" stroke="#2B343B" stroke-width="1.2" />
    <rect width="210" height="26" rx="6" fill="#14181B" />
    <text x="12" y="18" fill="#6F8F7B" class="mono" font-size="10" font-weight="700">03 // KNOWLEDGE GRAPH</text>

    <!-- Visual Graph Nodes Mock -->
    <g transform="translate(20, 48)">
      <circle cx="16" cy="18" r="8" fill="#1D2327" stroke="#6F8F7B" stroke-width="1.5" />
      <circle cx="68" cy="10" r="7" fill="#1D2327" stroke="#C79A3B" stroke-width="1.5" />
      <circle cx="68" cy="38" r="7" fill="#1D2327" stroke="#4F7A5A" stroke-width="1.5" />
      <circle cx="130" cy="24" r="8" fill="#1D2327" stroke="#B5693E" stroke-width="1.5" />
      <line x1="24" y1="16" x2="61" y2="12" stroke="#6F8F7B" stroke-width="1" />
      <line x1="24" y1="21" x2="61" y2="35" stroke="#6F8F7B" stroke-width="1" />
      <line x1="75" y1="13" x2="122" y2="21" stroke="#C79A3B" stroke-width="1" />
      <line x1="75" y1="36" x2="122" y2="27" stroke="#4F7A5A" stroke-width="1" />
    </g>

    <g transform="translate(16, 98)">
      <rect width="52" height="18" rx="3" fill="#14181B" stroke="#4F7A5A" stroke-width="0.8" />
      <text x="26" y="12" text-anchor="middle" fill="#6F8F7B" class="mono" font-size="9">ACTIVE</text>

      <rect x="60" width="56" height="18" rx="3" fill="#14181B" stroke="#B5693E" stroke-width="0.8" />
      <text x="88" y="12" text-anchor="middle" fill="#B5693E" class="mono" font-size="9">ZOMBIE</text>

      <rect x="122" width="56" height="18" rx="3" fill="#14181B" stroke="#C79A3B" stroke-width="0.8" />
      <text x="150" y="12" text-anchor="middle" fill="#C79A3B" class="mono" font-size="9">SHADOW</text>
    </g>
    <text x="16" y="132" fill="#8B979E" class="mono" font-size="9">State flow &amp; entity links</text>
  </g>

  <!-- ================= STAGE 4: TARGETED ATTACK PLANNER ================= -->
  <g transform="translate(850, 110)">
    <rect width="210" height="140" rx="6" fill="url(#cardGrad)" stroke="#2B343B" stroke-width="1.2" />
    <rect width="210" height="26" rx="6" fill="#14181B" />
    <text x="12" y="18" fill="#C79A3B" class="mono" font-size="10" font-weight="700">04 // ATTACK PLANNER</text>

    <text x="16" y="52" fill="#F2EFE8" class="sans" font-size="13" font-weight="600">Epistemic State Engine</text>
    <text x="16" y="68" fill="#D9D4C7" class="sans" font-size="11">Zero blind spray • Context-aware</text>

    <g transform="translate(16, 82)">
      <rect width="178" height="46" rx="4" fill="#14181B" stroke="#252C31" />
      <text x="10" y="16" fill="#C79A3B" class="mono" font-size="9">B2B Workflow Targeting:</text>
      <text x="10" y="30" fill="#D9D4C7" class="mono" font-size="9">• Hold / Pay / Issue States</text>
      <text x="10" y="42" fill="#8B979E" class="mono" font-size="9">• Multi-Tenant Cross Agency</text>
    </g>
  </g>

  <!-- ================= STAGE 5: SPECIALIST ATTACK EXECUTORS ================= -->
  <g transform="translate(850, 290)">
    <rect width="210" height="130" rx="6" fill="url(#cardGrad)" stroke="#2B343B" stroke-width="1.2" />
    <rect width="210" height="26" rx="6" fill="#14181B" />
    <text x="12" y="18" fill="#B5693E" class="mono" font-size="10" font-weight="700">05 // SPECIALIST EXECUTORS</text>

    <g transform="translate(16, 40)">
      <circle cx="4" cy="6" r="3" fill="#A8403A" />
      <text x="14" y="10" fill="#F2EFE8" class="mono" font-size="11">BOLA / IDOR Specialist</text>
      <circle cx="4" cy="24" r="3" fill="#B5693E" />
      <text x="14" y="28" fill="#F2EFE8" class="mono" font-size="11">BFLA Role Escalation</text>
      <circle cx="4" cy="42" r="3" fill="#C79A3B" />
      <text x="14" y="46" fill="#F2EFE8" class="mono" font-size="11">State-Flow &amp; Price Tamper</text>
      <circle cx="4" cy="60" r="3" fill="#6F8F7B" />
      <text x="14" y="64" fill="#F2EFE8" class="mono" font-size="11">SSTI, Mass Assign, SSRF</text>
    </g>
  </g>

  <!-- ================= STAGE 6: HARD SAFETY EGRESS CORE ================= -->
  <g transform="translate(460, 290)">
    <rect width="320" height="130" rx="6" fill="url(#safetyGrad)" stroke="#4F7A5A" stroke-width="1.8" filter="url(#glowGreen)" />
    <rect width="320" height="26" rx="6" fill="#101915" />
    <circle cx="16" cy="13" r="4" fill="#4F7A5A" />
    <text x="28" y="17" fill="#6F8F7B" class="mono" font-size="11" font-weight="700">SAFETY EGRESS: SafeHttpClient</text>

    <g transform="translate(18, 42)">
      <text x="0" y="12" fill="#F2EFE8" class="sans" font-size="12" font-weight="600">Hard Architectural Boundaries</text>
      <text x="0" y="30" fill="#D9D4C7" class="mono" font-size="10">• Immutable scope.yaml SHA-256 Lock</text>
      <text x="0" y="46" fill="#D9D4C7" class="mono" font-size="10">• Token Bucket (25 req/s) &amp; Strain Monitor</text>
      <text x="0" y="62" fill="#D9D4C7" class="mono" font-size="10">• Atomic Kill Switch &amp; Approvals Gate</text>
    </g>
    <rect x="230" y="80" width="76" height="22" rx="3" fill="#14181B" stroke="#4F7A5A" stroke-width="1" />
    <text x="268" y="95" text-anchor="middle" fill="#6F8F7B" class="mono" font-size="9" font-weight="600">0 ESCAPES</text>
  </g>

  <!-- ================= STAGE 7: DOUBLE-PROOF DIFFERENTIAL VERIFIER ================= -->
  <g transform="translate(90, 290)">
    <rect width="300" height="130" rx="6" fill="url(#cardGrad)" stroke="#4F7A5A" stroke-width="1.5" />
    <rect width="300" height="26" rx="6" fill="#14181B" />
    <text x="12" y="18" fill="#4F7A5A" class="mono" font-size="10" font-weight="700">06 // DOUBLE-PROOF VERIFIER</text>

    <!-- Checkmark Badge -->
    <circle cx="275" cy="13" r="8" fill="#1D2327" stroke="#4F7A5A" stroke-width="1.2" />
    <polyline points="271,13 274,16 279,10" fill="none" stroke="#6F8F7B" stroke-width="1.5" />

    <g transform="translate(16, 40)">
      <text x="0" y="12" fill="#F2EFE8" class="sans" font-size="13" font-weight="600">"Proof or Silence" Invariant</text>
      <text x="0" y="30" fill="#D9D4C7" class="sans" font-size="11">Negative Control &amp; Differential Check</text>
      <rect x="0" y="42" width="268" height="34" rx="4" fill="#14181B" stroke="#252C31" />
      <text x="10" y="58" fill="#6F8F7B" class="mono" font-size="10">2x Independent Confirmation</text>
      <text x="10" y="70" fill="#8B979E" class="mono" font-size="9">Zero Hallucinations • Cryptographic Signature</text>
    </g>
  </g>

  <!-- ================= BOTTOM BAR: MISSION CONTROL & RETEST ================= -->
  <g transform="translate(40, 480)">
    <rect width="1120" height="64" rx="8" fill="#14181B" stroke="#2B343B" stroke-width="1.2" />
    
    <g transform="translate(24, 22)">
      <circle cx="6" cy="10" r="5" fill="#4F7A5A" />
      <text x="20" y="14" fill="#F2EFE8" class="sans" font-size="14" font-weight="600">TRIPWIRE Mission Control &amp; Duplex WebSocket</text>
      <text x="20" y="28" fill="#8B979E" class="mono" font-size="10">Local UI: http://127.0.0.1:8765 • 60 FPS Canvas • 12ms INP</text>
    </g>

    <g transform="translate(800, 18)">
      <rect width="290" height="28" rx="4" fill="#1D2327" stroke="#6F8F7B" stroke-width="1" />
      <text x="145" y="18" text-anchor="middle" fill="#6F8F7B" class="mono" font-size="11" font-weight="600">AUTO RETEST: 100% RESOLUTION</text>
    </g>
  </g>
</svg>
