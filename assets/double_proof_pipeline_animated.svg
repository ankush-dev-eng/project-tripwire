<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="360">
  <defs>
    <linearGradient id="dbCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181B" />
      <stop offset="100%" stop-color="#191F23" />
    </linearGradient>
    <linearGradient id="dbCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D2327" />
      <stop offset="100%" stop-color="#171C20" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6F8F7B" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#4F7A5A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6F8F7B" stop-opacity="0.1" />
    </linearGradient>

    <filter id="dbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="dbGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#252C31" stroke-width="0.6" />
    </pattern>

    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Instrument Sans', -apple-system, sans-serif; }
      
      @keyframes dashAnim {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }
      .anim-stream {
        stroke-dasharray: 6 4;
        animation: dashAnim 2s linear infinite;
      }
      .anim-stream-fast {
        stroke-dasharray: 4 4;
        animation: dashAnim 1.2s linear infinite;
      }

      @keyframes pulseSign {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      .pulse-cert {
        transform-origin: 950px 180px;
        animation: pulseSign 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="360" fill="url(#dbCanvas)" rx="8" />
  <rect width="1100" height="360" fill="url(#dbGrid)" opacity="0.4" rx="8" />

  <!-- Title Bar -->
  <g transform="translate(35, 30)">
    <circle cx="8" cy="8" r="4" fill="#6F8F7B" />
    <text x="22" y="12" fill="#6F8F7B" class="mono" font-size="12" font-weight="700" letter-spacing="1.5">DOUBLE-PROOF DIFFERENTIAL VERIFIER ENGINE</text>
    <text x="22" y="28" fill="#D9D4C7" class="sans" font-size="13">Strict "Proof or Silence" Invariant: Deterministic Elimination of False Positives</text>
  </g>

  <!-- Flow Wires -->
  <path d="M 270 140 L 370 140 L 370 165 L 420 165" fill="none" stroke="#B5693E" stroke-width="2" class="anim-stream" />
  <path d="M 270 230 L 370 230 L 370 195 L 420 195" fill="none" stroke="#6F8F7B" stroke-width="2" class="anim-stream" />
  <path d="M 680 180 L 760 180" fill="none" stroke="#4F7A5A" stroke-width="2.5" class="anim-stream-fast" />

  <!-- Node 1A: Mutation / Probe Request -->
  <g transform="translate(35, 95)">
    <rect width="235" height="85" rx="6" fill="url(#dbCard)" stroke="#B5693E" stroke-width="1.2" />
    <rect width="235" height="22" rx="6" fill="#14181B" />
    <text x="10" y="15" fill="#B5693E" class="mono" font-size="10" font-weight="700">PROBE A: MUTATION PAYLOAD</text>
    <text x="12" y="38" fill="#F2EFE8" class="mono" font-size="11">POST /api/v1/bookings/101/pay</text>
    <text x="12" y="52" fill="#D9D4C7" class="mono" font-size="10">Auth: Bearer Agency_Beta (Cross-Tenant)</text>
    <text x="12" y="66" fill="#A8403A" class="mono" font-size="10">Body: {"total_amount": 1.00}</text>
  </g>

  <!-- Node 1B: Negative Control Baseline -->
  <g transform="translate(35, 195)">
    <rect width="235" height="85" rx="6" fill="url(#dbCard)" stroke="#4F7A5A" stroke-width="1.2" />
    <rect width="235" height="22" rx="6" fill="#14181B" />
    <text x="10" y="15" fill="#6F8F7B" class="mono" font-size="10" font-weight="700">CONTROL B: NEGATIVE BASELINE</text>
    <text x="12" y="38" fill="#F2EFE8" class="mono" font-size="11">POST /api/v1/bookings/101/pay</text>
    <text x="12" y="52" fill="#D9D4C7" class="mono" font-size="10">Auth: Bearer Agency_Alpha (Legit Owner)</text>
    <text x="12" y="66" fill="#4F7A5A" class="mono" font-size="10">Body: {"total_amount": 1450.00}</text>
  </g>

  <!-- Node 2: Differential Oracle Comparison Matrix -->
  <g transform="translate(420, 115)">
    <rect width="260" height="135" rx="6" fill="url(#dbCard)" stroke="#2B343B" stroke-width="1.5" />
    <rect width="260" height="24" rx="6" fill="#14181B" />
    <text x="12" y="16" fill="#C79A3B" class="mono" font-size="10" font-weight="700">DIFFERENTIAL ORACLE MATRIX</text>
    
    <g transform="translate(14, 38)">
      <text x="0" y="10" fill="#F2EFE8" class="sans" font-size="11" font-weight="600">Oracle Check 1: Status Code != 401/403</text>
      <text x="0" y="24" fill="#6F8F7B" class="mono" font-size="10">✓ Probe succeeded with 200 OK</text>
      
      <text x="0" y="44" fill="#F2EFE8" class="sans" font-size="11" font-weight="600">Oracle Check 2: Side-Effect Delta</text>
      <text x="0" y="58" fill="#6F8F7B" class="mono" font-size="10">✓ Wallet debited $1.00 instead of $1450</text>

      <text x="0" y="78" fill="#F2EFE8" class="sans" font-size="11" font-weight="600">Oracle Check 3: Independent Repeat (2x)</text>
      <text x="0" y="92" fill="#4F7A5A" class="mono" font-size="10">✓ Confirmed in isolated clean session</text>
    </g>
  </g>

  <!-- Node 3: Cryptographic Finding Proof Package -->
  <g transform="translate(760, 105)" class="pulse-cert">
    <rect width="300" height="155" rx="6" fill="#16231D" stroke="#4F7A5A" stroke-width="2" filter="url(#dbGlow)" />
    <rect width="300" height="26" rx="6" fill="#0E1713" />
    <circle cx="16" cy="13" r="5" fill="#4F7A5A" />
    <text x="28" y="17" fill="#6F8F7B" class="mono" font-size="11" font-weight="700">VERIFIED DOUBLE-PROOF ARTIFACT</text>

    <g transform="translate(16, 42)">
      <rect width="268" height="22" rx="3" fill="#14181B" stroke="#252C31" />
      <text x="8" y="15" fill="#C79A3B" class="mono" font-size="10">FINDING: B2B-STATE-TAMPER-001</text>

      <text x="0" y="40" fill="#D9D4C7" class="sans" font-size="11">Severity: <tspan fill="#A8403A" font-weight="700">CRITICAL ($100k wallet risk)</tspan></text>
      <text x="0" y="56" fill="#D9D4C7" class="mono" font-size="10">Double Confirmation: 2 / 2 Passed</text>
      <text x="0" y="72" fill="#8B979E" class="mono" font-size="9">SHA-256 Proof: e3b0c44298fc1c149afbf4c8...</text>
      <text x="0" y="88" fill="#6F8F7B" class="mono" font-size="10">100% Deterministic • Replayable cURL Script</text>
    </g>
  </g>

  <!-- Bottom Metric Banner -->
  <g transform="translate(35, 305)">
    <rect width="1025" height="36" rx="4" fill="#14181B" stroke="#252C31" />
    <text x="20" y="22" fill="#D9D4C7" class="sans" font-size="12">
      Empirical Result: <tspan fill="#4F7A5A" font-weight="700" class="mono">100.0% Precision</tspan> across Dev &amp; Held-Out sets • <tspan fill="#6F8F7B" font-weight="700" class="mono">0.0% Duplicate Findings</tspan> • <tspan fill="#6F8F7B" font-weight="700" class="mono">Zero Alert Fatigue</tspan>
    </text>
  </g>
</svg>
