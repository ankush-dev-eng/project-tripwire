<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 50" width="800" height="50">
  <style>
    .tagline-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      fill: #6F8F7B;
      font-weight: 500;
    }
    .cursor {
      animation: blink 0.8s infinite;
      fill: #4F7A5A;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
  <text x="10" y="30" class="tagline-text">
    [TRIPWIRE] Watching B2B endpoints • Differential proofs • Zero false-positives
  </text>
  <rect x="740" y="16" width="9" height="18" class="cursor" />
</svg>

