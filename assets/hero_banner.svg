<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101416" />
      <stop offset="50%" stop-color="#14181B" />
      <stop offset="100%" stop-color="#1B2226" />
    </linearGradient>

    <!-- Scanning Laser Gradient -->
    <linearGradient id="wireGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6F8F7B" stop-opacity="0.0" />
      <stop offset="30%" stop-color="#6F8F7B" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#4F7A5A" stop-opacity="1" />
      <stop offset="90%" stop-color="#C79A3B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6F8F7B" stop-opacity="0.0" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F8F7B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6F8F7B" stop-opacity="0.0" />
    </linearGradient>

    <!-- Blur & Glow Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Blueprint Grid -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#21282D" stroke-width="0.75" />
    </pattern>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .sans { font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif; }

      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .radar-disk {
        transform-origin: 1040px 100px;
        animation: radarRotate 8s linear infinite;
      }

      @keyframes tripwirePulse {
        0% { transform: translateX(0px); opacity: 0.2; }
        50% { opacity: 1; }
        100% { transform: translateX(780px); opacity: 0.2; }
      }
      .laser-pulse {
        animation: tripwirePulse 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes beaconBlink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #6F8F7B); }
        50% { opacity: 0.35; filter: none; }
      }
      .beacon {
        animation: beaconBlink 2.2s infinite ease-in-out;
      }

      @keyframes nodePop {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
      .pulse-node {
        transform-origin: center;
        animation: nodePop 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="340" fill="url(#bg)" rx="10" />
  <rect width="1200" height="340" fill="url(#grid)" opacity="0.6" rx="10" />

  <!-- Radar Scanner Ring Background -->
  <g opacity="0.45">
    <circle cx="1040" cy="100" r="85" fill="none" stroke="#253037" stroke-width="1.2" />
    <circle cx="1040" cy="100" r="55" fill="none" stroke="#253037" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="1040" cy="100" r="25" fill="none" stroke="#253037" stroke-width="1" />
    <!-- Rotating Sector -->
    <path d="M 1040 100 L 1125 100 A 85 85 0 0 1 1040 185 Z" fill="url(#radarSweep)" class="radar-disk" />
  </g>

  <!-- Scope Lock Indicator Badge -->
  <g transform="translate(910, 26)">
    <rect width="250" height="34" rx="5" fill="#14181B" stroke="#4F7A5A" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#4F7A5A" class="beacon" />
    <text x="34" y="22" fill="#F2EFE8" class="mono" font-size="11" font-weight="700" letter-spacing="1">SCOPE-LOCKED // LAB</text>
    <rect x="180" y="7" width="58" height="20" rx="3" fill="#1B2B22" stroke="#4F7A5A" stroke-width="0.8" />
    <text x="209" y="21" text-anchor="middle" fill="#6F8F7B" class="mono" font-size="9" font-weight="600">ACTIVE</text>
  </g>

  <!-- Primary Typography & Branding -->
  <g transform="translate(60, 48)">
    <g transform="translate(0, 0)">
      <rect width="90" height="20" rx="3" fill="#1B2327" stroke="#6F8F7B" stroke-width="0.8" />
      <text x="45" y="14" text-anchor="middle" fill="#6F8F7B" class="mono" font-size="10" font-weight="700">v1.1.0 RELEASE</text>
    </g>

    <text x="0" y="58" fill="#F2EFE8" class="sans" font-size="44" font-weight="800" letter-spacing="1.5">PROJECT TRIPWIRE</text>
    <text x="0" y="92" fill="#D9D4C7" class="sans" font-size="18" font-weight="400" letter-spacing="0.4">Agentic Real-Time DAST Engine for B2B Travel Platforms</text>
    <text x="0" y="118" fill="#6F8F7B" class="mono" font-size="12" font-weight="500">Autonomous Change Detection • Workflow Semantics • Double-Proof Differential Engine</text>
  </g>

  <!-- Animated Sensor Path & Tripwire Nodes -->
  <g transform="translate(60, 205)">
    <!-- Base track with laser tick marks -->
    <line x1="0" y1="45" x2="1080" y2="45" stroke="#252D32" stroke-width="2.5" />
    <line x1="0" y1="42" x2="1080" y2="42" stroke="#1D2429" stroke-width="1" stroke-dasharray="6 12" />
    
    <!-- Moving Active Tripwire Laser Sweep -->
    <g class="laser-pulse">
      <line x1="0" y1="45" x2="300" y2="45" stroke="url(#wireGlow)" stroke-width="3.5" filter="url(#glow)" />
      <circle cx="150" cy="45" r="3" fill="#C79A3B" filter="url(#softGlow)" />
    </g>

    <!-- Node 1: Deploy Ingest -->
    <g transform="translate(100, 45)">
      <circle cx="0" cy="0" r="16" fill="#181F23" stroke="#6F8F7B" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" fill="#F2EFE8" class="mono" font-size="10" font-weight="700">01</text>
      <text x="0" y="32" text-anchor="middle" fill="#F2EFE8" class="mono" font-size="11" font-weight="600">DEPLOY</text>
      <text x="0" y="46" text-anchor="middle" fill="#8B979E" class="mono" font-size="9">Change Hook</text>
    </g>

    <!-- Node 2: Spec-Free Recon -->
    <g transform="translate(320, 45)">
      <circle cx="0" cy="0" r="16" fill="#181F23" stroke="#6F8F7B" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" fill="#F2EFE8" class="mono" font-size="10" font-weight="700">02</text>
      <text x="0" y="32" text-anchor="middle" fill="#F2EFE8" class="mono" font-size="11" font-weight="600">RECON</text>
      <text x="0" y="46" text-anchor="middle" fill="#8B979E" class="mono" font-size="9">Spec-Free</text>
    </g>

    <!-- Node 3: Targeted Plan -->
    <g transform="translate(540, 45)">
      <circle cx="0" cy="0" r="16" fill="#181F23" stroke="#C79A3B" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" fill="#F2EFE8" class="mono" font-size="10" font-weight="700">03</text>
      <text x="0" y="32" text-anchor="middle" fill="#F2EFE8" class="mono" font-size="11" font-weight="600">PLAN</text>
      <text x="0" y="46" text-anchor="middle" fill="#8B979E" class="mono" font-size="9">State Flow</text>
    </g>

    <!-- Node 4: Safe Execution -->
    <g transform="translate(760, 45)">
      <circle cx="0" cy="0" r="16" fill="#181F23" stroke="#B5693E" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" fill="#F2EFE8" class="mono" font-size="10" font-weight="700">04</text>
      <text x="0" y="32" text-anchor="middle" fill="#F2EFE8" class="mono" font-size="11" font-weight="600">EXECUTE</text>
      <text x="0" y="46" text-anchor="middle" fill="#8B979E" class="mono" font-size="9">Safe Egress</text>
    </g>

    <!-- Node 5: Double Proof Verification -->
    <g transform="translate(980, 45)">
      <circle cx="0" cy="0" r="17" fill="#181F23" stroke="#4F7A5A" stroke-width="2.5" class="pulse-node" filter="url(#softGlow)" />
      <text x="0" y="4" text-anchor="middle" fill="#6F8F7B" class="mono" font-size="10" font-weight="800">05</text>
      <text x="0" y="32" text-anchor="middle" fill="#6F8F7B" class="mono" font-size="11" font-weight="700">VERIFY</text>
      <text x="0" y="46" text-anchor="middle" fill="#4F7A5A" class="mono" font-size="9" font-weight="600">Double Proof</text>
    </g>
  </g>
</svg>
